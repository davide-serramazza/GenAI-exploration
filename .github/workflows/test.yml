name: Python CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # We only install what is needed to run the retrieval test
          pip install pytest chromadb sentence-transformers torch
          # If you have a requirements.txt, you can do: pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tests/