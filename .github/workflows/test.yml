name: Python CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # We only install what is needed to run the retrieval test
          pip install pytest chromadb sentence-transformers torch
          # If you have a requirements.txt, you can do: pip install -r requirements.txt

      - name: Run tests
        run: |
          export PYTHONPATH=.
          pytest tests/